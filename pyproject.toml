[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optocurator"
version = "1.0.0"
description = "Lightweight desktop GUI application for statistical identification, manual curation, and multi-session response-type clustering of optogenetically tagged electrophysiological units."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Bram Nuttin" }
]
keywords = [
    "neuroscience",
    "electrophysiology",
    "optogenetics",
    "optotagging",
    "spike-sorting",
    "active-learning",
    "pyqt6",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyQt6>=6.5.0,<6.10",
    "pyqtgraph>=0.13.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "elephant>=1.0",
    "neo>=0.12",
    "quantities>=0.14",
    "h5py>=3.10",
]

[project.optional-dependencies]
umap = [
    "umap-learn>=0.5",
]
dev = [
    "pytest>=7.0.0",
    "pillow>=9.0",
]
build = [
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
optocurator = "optocurator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/optocurator"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/environment.yml",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
